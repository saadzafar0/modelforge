stages:
  ingest:
    cmd: python -m modelforge.pipeline ingest
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - src/modelforge/data/pipeline.py
      - src/modelforge/utils/common.py
      - requirements.txt
    params:
      - dataset
    outs:
      - data/raw
  validate:
    cmd: python -m modelforge.pipeline validate
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - data/raw
      - src/modelforge/data/pipeline.py
      - src/modelforge/utils/common.py
    params:
      - dataset
    outs:
      - reports/data/validation.json:
          cache: false
  preprocess:
    cmd: python -m modelforge.pipeline preprocess
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - data/raw
      - reports/data/validation.json
      - src/modelforge/data/pipeline.py
      - src/modelforge/utils/common.py
      - requirements.txt
    params:
      - project
      - split
      - dataset
    outs:
      - data/processed
      - reports/data/splits.json:
          cache: false
  train_baseline:
    cmd: python -m modelforge.pipeline baseline
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - data/processed
      - reports/data/validation.json
      - reports/data/splits.json
      - src/modelforge/training/runner.py
      - src/modelforge/models/mlp.py
      - src/modelforge/utils/common.py
      - requirements.txt
    params:
      - project
      - baseline
      - training
      - tracking
    outs:
      - models/baseline
  search_and_train:
    cmd: python -m modelforge.pipeline search
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - data/processed
      - reports/data/validation.json
      - reports/data/splits.json
      - src/modelforge/training/runner.py
      - src/modelforge/models/mlp.py
      - src/modelforge/utils/common.py
      - requirements.txt
    params:
      - project
      - search
      - training
      - tracking
      - evaluation.selection_rule
    outs:
      - models/nas
  evaluate_baseline:
    cmd: python -m modelforge.pipeline evaluate-baseline
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - data/processed
      - models/baseline
      - src/modelforge/evaluation/runner.py
      - src/modelforge/models/inference.py
      - src/modelforge/models/mlp.py
      - src/modelforge/utils/common.py
      - requirements.txt
    params:
      - project
      - tracking
      - evaluation
    metrics:
      - reports/metrics/baseline.json:
          cache: false
    outs:
      - reports/classification/baseline.json:
          cache: false
      - reports/figures/baseline_confusion_matrix.png:
          cache: false
  evaluate_nas:
    cmd: python -m modelforge.pipeline evaluate-nas
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - data/processed
      - models/nas
      - src/modelforge/evaluation/runner.py
      - src/modelforge/models/inference.py
      - src/modelforge/models/mlp.py
      - src/modelforge/utils/common.py
      - requirements.txt
    params:
      - project
      - tracking
      - evaluation
    metrics:
      - reports/metrics/nas.json:
          cache: false
    outs:
      - reports/classification/nas.json:
          cache: false
      - reports/figures/nas_confusion_matrix.png:
          cache: false
  compare:
    cmd: python -m modelforge.pipeline compare
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - reports/metrics/baseline.json
      - reports/metrics/nas.json
      - src/modelforge/evaluation/runner.py
      - src/modelforge/utils/common.py
    params:
      - evaluation.selection_rule
    outs:
      - reports/metrics/comparison.json:
          cache: false
  register:
    cmd: python -m modelforge.pipeline register
    deps:
      - src/modelforge/pipeline.py
      - pyproject.toml
      - models/nas
      - data/processed
      - reports/metrics/nas.json
      - src/modelforge/tracking/registry.py
      - src/modelforge/models/inference.py
      - src/modelforge/models/mlp.py
      - src/modelforge/utils/common.py
    params:
      - tracking
    outs:
      - reports/tracking/registry.json:
          cache: false
