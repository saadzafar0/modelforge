[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-mlops"
version = "0.1.0"
description = "Reproducible CPU neural architecture search and MLOps pipeline"
requires-python = ">=3.12,<3.13"

[project.scripts]
modelforge = "modelforge.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

